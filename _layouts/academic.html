<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.data.profile.name | escape }} — {{ site.data.profile.role | escape }}</title>
  <meta name="description" content="{{ site.description | strip_newlines | escape }}">
  <meta name="theme-color" content="#f8f7f3">
  <meta property="og:title" content="{{ site.data.profile.name | escape }}">
  <meta property="og:description" content="{{ site.description | strip_newlines | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% assign p = site.data.profile %}
  <div class="site-shell">
    <header class="masthead">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ p.name | escape }}<span class="wordmark-dot">.</span></a>
      <nav aria-label="Main navigation">
        <a href="#about">About</a>
        {% if p.research != '' or p.publications.size > 0 %}<a href="#research">Research</a>{% endif %}
        <a href="#education">Education</a>
        {% if p.cv != '' %}<a href="{{ p.cv | relative_url }}">CV <span aria-hidden="true">↗</span></a>{% endif %}
      </nav>
    </header>
    {{ content }}
    <footer class="site-footer">
      <span>© {{ 'now' | date: '%Y' }} {{ p.name | escape }}</span>
      <span class="footer-note">Personal academic website</span>
      <a href="#top">Back to top <span aria-hidden="true">↑</span></a>
    </footer>
  </div>
</body>
</html>
