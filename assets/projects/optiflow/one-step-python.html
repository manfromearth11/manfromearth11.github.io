<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>One-step policy · Python motion draft</title>
<style>
*{box-sizing:border-box}body{margin:0;background:white;color:#242124;font-family:Arial,sans-serif}main{max-width:480px;margin:36px auto;padding:0 20px}h1{text-align:center;font-size:22px;color:#d55089;font-weight:600;margin:0 0 24px}canvas{display:block;width:100%;height:auto}.controls{display:flex;gap:12px;margin-top:24px}button{padding:9px 14px;background:white;border:1px solid #bcc4ce;border-radius:4px;font:14px Arial;cursor:pointer}input{width:100%;accent-color:#d55089;margin-top:22px}#error{color:#a02832}
</style>
</head><body><main>
<h1>One-step policy</h1>
<canvas width="880" height="880" aria-label="Symmetric policy density evolving from one mode into two modes"></canvas>
<div class="controls"><button id="play">Pause</button><button id="replay">Replay</button></div>
<input id="timeline" type="range" min="0" max="3199" step="1" value="0" aria-label="Animation timeline">
<p id="error" hidden>Unable to load the motion. Please reload.</p>
</main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const play=document.querySelector('#play'),timeline=document.querySelector('#timeline');
let data,time=0,last=0,playing=true;
const duration=3200,clamp=x=>Math.min(1,Math.max(0,x));
function draw(){
 if(!data)return;
 const t=clamp((time-800)/800),progress=t*t*(3-2*t);
 const frame=data.frames[Math.round(progress*(data.frames.length-1))];
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,880,880);
 ctx.translate(8,8);ctx.scale(864/400,864/400);
 ctx.fillStyle='#f8ebf2';ctx.fillRect(0,0,400,400);
 frame.forEach((path,i)=>{ctx.fillStyle=data.colors[i];ctx.fill(path);ctx.strokeStyle='#242124';ctx.lineWidth=1.4;ctx.stroke(path)});
 ctx.strokeStyle='#000';ctx.lineWidth=2.5;ctx.strokeRect(0,0,400,400);
 timeline.value=time;
}
function tick(now){if(last&&playing)time=(time+Math.min(now-last,100))%duration;last=now;draw();requestAnimationFrame(tick)}
play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play'};
document.querySelector('#replay').onclick=()=>{time=0;playing=true;play.textContent='Pause';draw()};
timeline.oninput=()=>{time=Number(timeline.value);playing=false;play.textContent='Play';draw()};
fetch('one-step-motion.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(result=>{data={...result,frames:result.frames.map(frame=>frame.map(path=>new Path2D(path)))};requestAnimationFrame(tick)}).catch(()=>{document.querySelector('#error').hidden=false});
</script></body></html>
