<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OptiFlow · transport animation</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" defer></script>
<script>if(new URLSearchParams(location.search).has("embed"))document.documentElement.classList.add("embedded");</script>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#233047;font-family:Arial,sans-serif}main{max-width:1500px;margin:auto;padding:28px 30px}header{display:flex;align-items:baseline;gap:18px;padding-bottom:18px;border-bottom:1px solid #e4e9f0}h1{font-size:26px;letter-spacing:-1px;margin:0}header span,.note{color:#788599;font-size:13px}.viewport{overflow-x:auto}.diagram{position:relative;aspect-ratio:1200/380;min-width:0}canvas{position:absolute;width:100%;height:100%;inset:0}.label{position:absolute;text-align:center;transform:translateX(-50%);color:#34465e;font-size:clamp(17px,1.5vw,22px);line-height:1.4}.label.blue{color:#2868c5}.label.pink{color:#d55089}.label.small{font-size:14px;color:#718097}.label.math{font-size:clamp(16px,1.4vw,20px)}.heading{font-weight:600}.step-number{display:block;font-size:12px;letter-spacing:1px;color:#8c99aa;margin-bottom:8px}.controls{display:flex;align-items:center;gap:14px;border-top:1px solid #e4e9f0;padding-top:20px}button{background:#fff;border:1px solid #dbe3ed;padding:10px 15px;color:#34465e;font:14px Arial;border-radius:6px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #2868c5;outline-offset:3px}button[aria-pressed=true]{background:#edf3fd;border-color:#aac3e9;color:#245caa}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}input{flex:1;accent-color:#2868c5}#caption{min-height:52px;font-size:17px;line-height:1.65;margin:20px 0 8px}.note{line-height:1.7;max-width:1000px;margin-top:8px}.katex{font-size:1.05em}.math{white-space:nowrap}#math-error{color:#a32323}@media(max-width:600px){main{padding:20px 12px}.diagram{min-width:680px}header{flex-wrap:wrap;gap:6px}}
.heading:has([data-tex]){white-space:nowrap;font-size:clamp(16px,1.7vw,25px)}.heading [data-tex]{display:inline-block;margin-left:5px;font-weight:400}
.flow-label{top:56.578947%;transform:translate(-50%,calc(-100% - 16px));font-size:clamp(14px,1.5vw,22px);white-space:nowrap;opacity:0}
.embedded main{max-width:none;padding:0 12px}.embedded header{display:none}.embedded .diagram{min-width:0}.embedded .viewport{overflow:hidden}
@media(max-width:800px){.heading:has([data-tex]){font-size:14px}}
</style></head>
<body><main><header><h1>OptiFlow</h1><span>From reference actions to transport-guided supervision</span></header>
<div class="viewport"><div class="diagram"><canvas id="scene" width="2400" height="760" aria-label="Reference and one-step distributions produce samples, reference masses are weighted by Q, Sinkhorn couples the sample sets, and pink samples move to their assigned high-value reference actions during distillation. Background Q-value shading peaks at the two upper modes in the transport panel."></canvas>
<div class="label heading blue" style="left:13.333333%;top:27.631579%;width:30%;transform:translate(-50%,calc(-100% - 16px))">Reference flow policy <span data-tex="\mu_\omega(s,z)"></span></div>
<div class="label heading" style="left:50%;top:27.631579%;width:30%;transform:translate(-50%,calc(-100% - 16px))">Value-weighted<br>Optimal Transport</div>
<div class="label heading pink" style="left:86.666667%;top:27.631579%;width:26%;transform:translate(-50%,calc(-100% - 16px))">One-step policy <span data-tex="\mu_\theta(s,z)"></span></div>
<div id="sample-label" class="label blue heading flow-label" style="left:31.666667%">Sample<br>actions</div>
<div id="policy-sample-label" class="label pink heading flow-label" style="left:68.333333%">Sample<br>actions</div>
<div id="distill-label" class="label pink heading flow-label" style="left:68.333333%">Distill</div>
</div></div>
</main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.scale(2,2);
// Contours generated together from one symmetric density by Python.
// Use the exact frames approved in the isolated motion preview.
let policyMotion=null;
fetch(new URL('one-step-motion.json',location.href))
 .then(response=>{if(!response.ok)throw new Error(response.status);return response.json()})
 .then(data=>{policyMotion={...data,frames:data.frames.map(frame=>frame.map(path=>new Path2D(path)))}})
 .catch(error=>console.error('Unable to load policy motion',error));
function evolvingPolicy(panel,progress){
 if(!policyMotion){densityContours(panel,0,0,pink);return}
 const frame=policyMotion.frames[Math.round(clamp(progress)*(policyMotion.frames.length-1))];
 ctx.save();ctx.translate(...panel);ctx.scale(size/policyMotion.size,size/policyMotion.size);
 frame.forEach((path,i)=>{
  ctx.fillStyle=policyMotion.colors[i];ctx.fill(path);
  // Keep contour strokes at 1.5 scene pixels, matching the reference panel.
  ctx.strokeStyle='#242124';ctx.lineWidth=1.5*policyMotion.size/size;ctx.stroke(path);
 });
 if(policyMotion.centerCircle){
  const growth=ease((progress-.5)/.5);
  const [x,y,radius]=policyMotion.centerCircle;
  ctx.globalAlpha=clamp(growth*8);ctx.beginPath();
  ctx.arc(x,y,radius*growth,0,Math.PI*2);
  ctx.fillStyle=policyMotion.centerCircleFill;ctx.fill();
  ctx.strokeStyle='#242124';ctx.lineWidth=1.5*policyMotion.size/size*Math.min(1,growth*3);ctx.stroke();
 }
 ctx.restore();
 ctx.strokeStyle='#000';ctx.lineWidth=2.5;ctx.strokeRect(...panel,size,size);
}
const blue='#3475cf',pink='#dc6596',ink='#253449',gray='#8490a0',size=220;
const centers=[[-.52,.52],[.52,.52],[-.52,-.52],[.52,-.52]];
const arrowY=215;
const panels={ref:[50,105],ot:[490,105],out:[930,105]};
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,t)=>a+(b-a)*t;
function line(x,y,X,Y,color,alpha=1,width=1){ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.globalAlpha=1}
function arrow(x,y,X,Y,color=gray,alpha=1){line(x,y,X,Y,color,alpha,3);const a=Math.atan2(Y-y,X-x);ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X-12*Math.cos(a-.45),Y-12*Math.sin(a-.45));ctx.lineTo(X-12*Math.cos(a+.45),Y-12*Math.sin(a+.45));ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.globalAlpha=1}
function frame(pos,sz=size){ctx.fillStyle='#fafcfe';ctx.fillRect(...pos,sz,sz);ctx.strokeStyle='#000000';ctx.lineWidth=2.5;ctx.strokeRect(...pos,sz,sz);line(pos[0]+12,pos[1]+sz/2,pos[0]+sz-12,pos[1]+sz/2,'#edf1f6');line(pos[0]+sz/2,pos[1]+12,pos[0]+sz/2,pos[1]+sz-12,'#edf1f6')}
function dot(p,r,color,alpha=1){ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(...p,r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=.7;ctx.stroke();ctx.globalAlpha=1}
function at(panel,a,sz=size){return[panel[0]+sz/2+a.x*sz/2.5,panel[1]+sz/2-a.y*sz/2.5]}
const densityCache=new Map();
function densityContours(panel,spread,weight,color,outlineOnly=false,alpha=1,levels=[.12,.32,.65,1.05,1.5],shortTails=0){
 const cacheKey=JSON.stringify([Math.round(spread*90),Math.round(weight*90),color,outlineOnly,alpha,levels,shortTails]);
 if(densityCache.has(cacheKey)){ctx.drawImage(densityCache.get(cacheKey),...panel,size,size);return}
 const n=56,domain=1.25,step=2*domain/n,field=new Float64Array((n+1)*(n+1));
 const sigma=mix(color===pink?.18:.25,.15,spread);
 for(let y=0;y<=n;y++)for(let x=0;x<=n;x++){
  const X=-domain+x*step,Y=domain-y*step;let value=0;
  centers.forEach((c,j)=>{const tailScale=j>=2?mix(1,.35,shortTails):1;const dx=X-c[0]*spread*tailScale,dy=Y-c[1]*spread*tailScale;
   const angle=c[0]*c[1]>0?Math.PI/4:-Math.PI/4;
   const u=dx*Math.cos(angle)+dy*Math.sin(angle),v=-dx*Math.sin(angle)+dy*Math.cos(angle);
   value+=mix(1,j<2?1.92:.08,weight)*Math.exp(-.5*((u/(sigma*mix(1,2.1,spread)))**2+(v/sigma)**2));
  });field[y*(n+1)+x]=value;
 }

 levels.forEach((level,levelIndex)=>{
  const nodes=new Map(),adj=new Map();
  function add(key,p){if(!nodes.has(key))nodes.set(key,p);return key}
  function connect(a,b){if(!adj.has(a))adj.set(a,[]);if(!adj.has(b))adj.set(b,[]);adj.get(a).push(b);adj.get(b).push(a)}
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
   const vals=[field[y*(n+1)+x],field[y*(n+1)+x+1],field[(y+1)*(n+1)+x+1],field[(y+1)*(n+1)+x]];
   const pts=[[x,y],[x+1,y],[x+1,y+1],[x,y+1]],keys=[`h${x},${y}`,`v${x+1},${y}`,`h${x},${y+1}`,`v${x},${y}`],cross=[];
   for(let e=0;e<4;e++){const k=(e+1)%4;if((vals[e]>=level)!==(vals[k]>=level)){const t=(level-vals[e])/(vals[k]-vals[e]);cross.push(add(keys[e],[mix(pts[e][0],pts[k][0],t),mix(pts[e][1],pts[k][1],t)]));}}
   if(cross.length===2)connect(...cross);else if(cross.length===4){connect(cross[0],cross[1]);connect(cross[2],cross[3]);}
  }
  ctx.beginPath();const seen=new Set();
  for(const start of nodes.keys()){if(seen.has(start))continue;let current=start,prev=null;const path=[];
   while(current&&!seen.has(current)){seen.add(current);path.push(nodes.get(current));const next=(adj.get(current)||[]).find(k=>k!==prev);prev=current;current=next;}
   if(path.length<3)continue;path.forEach((p,i)=>{const X=panel[0]+p[0]/n*size,Y=panel[1]+p[1]/n*size;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.closePath();
  }
  ctx.globalAlpha=alpha;ctx.fillStyle=color+(levelIndex===0?'12':'19');if(!outlineOnly)ctx.fill('evenodd');ctx.strokeStyle='#000000';ctx.lineWidth=outlineOnly?1.8:1.5;ctx.stroke();ctx.globalAlpha=1;
 });
 const cached=document.createElement('canvas');cached.width=cached.height=size*2;cached.getContext('2d').drawImage(canvas,panel[0]*2,panel[1]*2,size*2,size*2,0,0,size*2,size*2);densityCache.set(cacheKey,cached);
}
let seed=741;function random(){seed=(1664525*seed+1013904223)>>>0;return(seed+.5)/4294967296}function normal(){return Math.sqrt(-2*Math.log(random()))*Math.cos(2*Math.PI*random())}
const refs=Array.from({length:32},(_,j)=>({x:centers[j%4][0]+normal()*.12,y:centers[j%4][1]+normal()*.12,mode:j%4}));
const sources=Array.from({length:16},()=>({x:normal()*.24,y:normal()*.24}));
// The background shading and reference weights share this illustrative Q field.
function actionValue(x,y){
 return [-.52,.52].reduce((value,c)=>value+Math.exp(-((x-c)**2+(y-.52)**2)/(2*.32**2)),0);
}
const q=refs.map(a=>Math.exp(actionValue(a.x,a.y)/.3)),sum=q.reduce((a,b)=>a+b);q.forEach((_,j)=>q[j]/=sum);
const costs=sources.map(a=>refs.map(b=>(a.x-b.x)**2+(a.y-b.y)**2));const mean=costs.flat().reduce((a,b)=>a+b)/512;
const K=costs.map(row=>row.map(c=>Math.exp(-c/mean/.12)));let u=sources.map(()=>1),v=refs.map(()=>1);
for(let n=0;n<500;n++){u=u.map((_,i)=>(1/16)/K[i].reduce((s,k,j)=>s+k*v[j],0));v=v.map((_,j)=>q[j]/K.reduce((s,row,i)=>s+row[j]*u[i],0));}
const P=K.map((row,i)=>row.map((k,j)=>k*u[i]*v[j])),targets=P.map(row=>row.indexOf(Math.max(...row))),maxMass=Math.max(...P.flat());
const residual=Math.max(...P.map(row=>Math.abs(row.reduce((a,b)=>a+b)-1/16)),...q.map((mass,j)=>Math.abs(P.reduce((s,row)=>s+row[j],0)-mass)));
if(residual>1e-6)console.error('Transport marginal residual',residual);
// The displayed samples follow the same selected OT assignments used above.
function transportedSource(i,progress){
 const source=sources[i],target=refs[targets[i]];
 return {x:mix(source.x,target.x,progress),y:mix(source.y,target.y,progress)};
}
// Filled contours: discrete value bands with crisp boundaries, no blur.
const valueField=document.createElement('canvas');
valueField.width=valueField.height=size*2;
const valueContext=valueField.getContext('2d');
const valuePixels=valueContext.createImageData(valueField.width,valueField.height);
const valueLevels=[.08,.24,.44,.66,.85];
const valueColors=[[235,239,245],[216,224,237],[191,204,224],[158,177,205],[120,146,184]];
for(let y=0;y<valueField.height;y++)for(let x=0;x<valueField.width;x++){
 const value=clamp(actionValue((x+.5)/valueField.width*2.5-1.25,1.25-(y+.5)/valueField.height*2.5));
 const i=(y*valueField.width+x)*4;
 const band=valueLevels.reduce((index,level,j)=>value>=level?j:index,-1);
 if(band<0)continue;
 const color=valueColors[band];
 valuePixels.data[i]=color[0];valuePixels.data[i+1]=color[1];valuePixels.data[i+2]=color[2];
 valuePixels.data[i+3]=255;
}
valueContext.putImageData(valuePixels,0,0);
function valueBackground(){
 ctx.save();ctx.translate(...panels.ot);
 ctx.beginPath();ctx.rect(1.5,1.5,size-3,size-3);ctx.clip();
 // Introduce the Q landscape clearly, then let the arriving samples take focus.
 ctx.globalAlpha=mix(1,.38,ease((time-3000)/600));
 ctx.drawImage(valueField,0,0,size,size);
 ctx.restore();
}
let time=0,last=0,lastDraw=0;
function draw(){ctx.clearRect(0,0,1200,380);const f=ease(time/2800),s=ease((time-3000)/2300),w=ease((time-5700)/600),o=ease((time-6400)/700),hard=ease((time-7200)/400),d=ease((time-8000)/800);const phase=time<3000?0:time<6000?1:time<9000?2:time<13500?3:4;
frame(panels.ref);frame(panels.ot);frame(panels.out);
densityContours(panels.ref,f,0,blue,false,1,[.12,.30,.55,.82]);
evolvingPolicy(panels.out,d);
valueBackground();
const sampleVisibility=ease((time-2400)/400);
arrow(290,arrowY,470,arrowY,blue,sampleVisibility);
document.querySelector('#sample-label').style.opacity=sampleVisibility;
const policySampleVisibility=sampleVisibility*(1-ease((time-7550)/200));
arrow(910,arrowY,730,arrowY,pink,policySampleVisibility);
document.querySelector('#policy-sample-label').style.opacity=policySampleVisibility;
const distillVisibility=ease((time-7800)/200);
arrow(730,arrowY,910,arrowY,pink,distillVisibility);
document.querySelector('#distill-label').style.opacity=distillVisibility;
if(o>0){P.forEach((row,i)=>row.forEach((mass,j)=>{const strength=mass/maxMass;if(strength<.012)return;const a=at(panels.ot,transportedSource(i,d)),b=at(panels.ot,refs[j]);line(...a,mix(a[0],b[0],o),mix(a[1],b[1],o),'#7189ae',(.08+.35*strength)*o*(1-d), .4+3*strength)}));
if(hard>0)sources.forEach((a,i)=>{line(...at(panels.ot,transportedSource(i,d)),...at(panels.ot,refs[targets[i]]),'#8a4e9d',hard*.8*(1-d),1+3*P[i][targets[i]]/maxMass)});
}
// Staggered, curved emission: each sample has a stable departure time and flight path.
function scatter(a,i,origin,color,radius,salt,transportProgress=0){
 const hash=k=>{const v=Math.sin((i+1)*127.1+(salt+k)*311.7)*43758.5453;return v-Math.floor(v)};
 const delay=hash(1)*1050,flight=1150+hash(2)*300;
 const elapsed=time-3000-delay;
 if(elapsed<0)return;
 const birth=clamp(elapsed/150),t=clamp((elapsed-120)/flight);
 const start=at(origin,a),end=at(panels.ot,a);
 const bend=(hash(3)-.5)*140;
 const direction=Math.sign(end[0]-start[0]);
 const c1=[start[0]+direction*(85+hash(4)*45),start[1]+bend];
 const c2=[end[0]-direction*(100+hash(5)*50),end[1]-bend*.65];
 const travel=t*t*(3-2*t);
 function position(u){const v=1-u;return[v*v*v*start[0]+3*v*v*u*c1[0]+3*v*u*u*c2[0]+u*u*u*end[0],v*v*v*start[1]+3*v*v*u*c1[1]+3*v*u*u*c2[1]+u*u*u*end[1]]}
 const current=transportProgress>0?at(panels.ot,transportedSource(i,transportProgress)):position(travel);
 if(t>0&&t<1){for(let k=3;k>0;k--){const p=position(Math.max(0,travel-k*.025)),next=position(Math.max(0,travel-(k-1)*.025));line(...p,...next,color,.045+(3-k)*.035,1.3)}}
 dot(current,radius*(.6+.4*birth),color,.92*birth);
}
if(time>=3000){
 refs.forEach((a,j)=>scatter(a,j,panels.ref,blue,Math.sqrt(mix(1/32,q[j],w)*32)*4.4,1));
 sources.forEach((a,i)=>scatter(a,i,panels.out,pink,4.4,8,d));
}

}
function tick(now){if(last&&policyMotion)time=(time+Math.min(now-last,100))%13000;last=now;if(now-lastDraw>=1000/60-1){draw();lastDraw=now}requestAnimationFrame(tick)}
window.addEventListener('DOMContentLoaded',()=>{if(!window.katex)return;document.querySelectorAll('[data-tex]').forEach(el=>katex.render(el.dataset.tex,el,{throwOnError:false}));});requestAnimationFrame(tick);
</script></body></html>
